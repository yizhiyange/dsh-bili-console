<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>刷B站观测台</title>
<style>
:root{
  --canvas:#F7F8FC; --card:#FFFFFF; --line:#E5E7EB; --sidebar:#EEF1F8;
  --blue:#1A73E8; --green:#34A853; --amber:#FBBC04; --red:#EA4335;
  --t1:#111111; --t2:#6B6B6B; --t3:#9AA0A6;
  --green-bg:#E6F4EA; --green-tx:#137333;
  --blue-bg:#E8F0FE;
  --amber-bg:#FEF6E0; --amber-tx:#B06000;
  --red-bg:#FCE8E6; --red-tx:#C5221F;
  --gray-bg:#F1F3F4;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--canvas);color:var(--t1);font-size:14px;color-scheme:light dark;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;color:var(--t1);}

.window{max-width:1440px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:100vh;}
.topbar{background:var(--card);border:1px solid var(--line);border-radius:8px;height:48px;display:flex;align-items:center;padding:0 16px;gap:12px;}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;}
.dot{width:18px;height:18px;border-radius:50%;background:var(--blue);}
.search{margin-left:auto;background:var(--canvas);border-radius:14px;height:28px;width:260px;display:flex;align-items:center;padding:0 12px;}
.search input{border:none;outline:none;background:none;font-size:12px;width:100%;color:var(--t1);}
.spill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--gray-bg);color:var(--t2);}
.spill .sd{width:8px;height:8px;border-radius:50%;background:var(--t3);}
.spill.run{background:var(--blue-bg);color:var(--blue);} .spill.run .sd{background:var(--blue);animation:pulse 1.1s infinite;}
.spill.ok{background:var(--green-bg);color:var(--green-tx);} .spill.ok .sd{background:var(--green);}
.spill.err{background:var(--red-bg);color:var(--red-tx);} .spill.err .sd{background:var(--red);}
.spill.warn{background:var(--amber-bg);color:var(--amber-tx);} .spill.warn .sd{background:var(--amber);}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(26,115,232,.5)}70%{box-shadow:0 0 0 7px rgba(26,115,232,0)}100%{box-shadow:0 0 0 0 rgba(26,115,232,0)}}

.banner{background:var(--amber-bg);border-radius:6px;min-height:40px;display:flex;align-items:center;padding:8px 12px;gap:10px;font-size:12px;}
.banner.err{background:var(--red-bg);} .banner.blue{background:var(--blue-bg);}
.banner .link{margin-left:auto;white-space:nowrap;}
.banner .ic{width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;}

.main{display:flex;gap:14px;flex:1;min-height:0;}
.sidebar{width:196px;flex-shrink:0;background:var(--sidebar);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px;align-self:flex-start;position:sticky;top:16px;}
.pill{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:17px;font-size:13px;color:var(--t1);width:100%;text-align:left;transition:background .12s;}
.pill:hover{background:rgba(26,115,232,.08);}
.pill.active{background:var(--blue);color:#fff;font-weight:600;}
.side-spacer{flex:1;min-height:8px;}
.mode-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:12px;}
.mode-card .link{text-align:left;font-size:11px;color:var(--blue);font-weight:600;}

.content{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;}
.page{display:none;flex-direction:column;gap:12px;}
.page.active{display:flex;}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.card-head .t{font-size:14px;font-weight:600;}
.card-head .sub{font-size:11px;color:var(--t2);}
.row-flex{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;}
.row-flex > .card{flex:1;min-width:240px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:11px;font-size:11px;white-space:nowrap;background:var(--gray-bg);color:var(--t2);}
.tag.green{background:var(--green-bg);color:var(--green-tx);}
.tag.blue{background:var(--blue-bg);color:var(--blue);}
.tag.amber{background:var(--amber-bg);color:var(--amber-tx);}
.tag.red{background:var(--red-bg);color:var(--red-tx);}
.tag.gray{background:var(--gray-bg);color:var(--t2);}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:6px;font-size:12px;font-weight:600;padding:7px 14px;white-space:nowrap;border:1px solid transparent;}
.btn.primary{background:var(--blue);color:#fff;} .btn.primary:hover{background:#1765cc;}
.btn.outline{background:var(--card);border:1px solid var(--blue);color:var(--blue);} .btn.outline:hover{background:var(--blue-bg);}
.btn.ghost{background:var(--card);border:1px solid #D4D4D4;color:var(--t2);} .btn.ghost:hover{border-color:var(--t2);}
.btn.danger{background:var(--red);color:#fff;} .btn.danger:hover{background:#d33426;}
.btn.sm{padding:5px 10px;font-size:11px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.link{color:var(--blue);font-size:12px;font-weight:600;background:none;}
.link:hover{text-decoration:underline;}

.toggle{width:44px;height:24px;border-radius:12px;background:#D4D4D4;position:relative;transition:background .15s;flex-shrink:0;cursor:pointer;}
.toggle::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
.toggle.on{background:var(--blue);} .toggle.on::after{left:23px;}

/* 自绘下拉（2026-10-31）：原生 <select> 在 webview 里点不开、弹出层永远白底 */
.selectbox{position:relative;display:inline-block;min-width:130px;}
.selbtn{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:13px;color:var(--t1);cursor:pointer;font-family:inherit;}
.selbtn i{color:var(--t2);font-size:11px;font-style:normal;}
.selpop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:80;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.22);padding:4px;max-height:240px;overflow:auto;display:none;}
.selopt{display:block;width:100%;text-align:left;padding:8px 10px;border:0;background:transparent;color:var(--t1);font-size:13px;border-radius:6px;cursor:pointer;font-family:inherit;}
.selopt:hover{background:rgba(127,127,127,.16);}
.selopt.on{background:rgba(127,127,127,.22);font-weight:600;}
.inputbox{display:flex;align-items:center;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:13px;gap:8px;}
.inputbox input{border:none;outline:none;flex:1;font-size:13px;background:none;min-width:0;}
.stepper{display:inline-flex;align-items:center;gap:10px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;font-size:13px;min-width:110px;justify-content:space-between;}
.stepper button{color:var(--t2);font-size:14px;padding:0 4px;} .stepper button:hover{color:var(--blue);}

.acct{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--blue);object-fit:cover;flex:none;}
img.avatar{border:1px solid var(--line);}
.acct .name{font-weight:600;font-size:13px;}
.acct .st{margin-left:auto;}
.note{font-size:12px;color:var(--t2);margin-bottom:10px;line-height:1.6;}
.big-num{font-size:24px;font-weight:700;margin:4px 0 2px;}
.big-num small{font-size:13px;color:var(--t2);font-weight:400;}
.progress{height:6px;background:var(--sidebar);border-radius:3px;overflow:hidden;margin-top:8px;}
.progress > div{height:100%;background:var(--blue);border-radius:3px;}
.sum-text{font-size:12px;color:var(--t2);line-height:1.7;}

.logline{display:flex;align-items:flex-start;gap:8px;font-size:12px;padding:4px 6px;border-radius:6px;cursor:pointer;}
.logline:hover{background:var(--gray-bg);}
.logline .ic{width:18px;flex-shrink:0;text-align:center;}
.logline .tm{color:var(--t2);width:70px;flex-shrink:0;font-size:11px;}
.logline .msg{color:var(--t1);flex:1;line-height:1.5;}
.logline .raw{display:none;color:var(--t3);font-size:11px;font-family:ui-monospace,Consolas,monospace;word-break:break-all;margin-top:3px;}
.logline.open .raw{display:block;}
.logbox{max-height:420px;overflow-y:auto;}
.logbox::-webkit-scrollbar{width:6px;} .logbox::-webkit-scrollbar-thumb{background:#D4D4D4;border-radius:3px;}

.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:11px;font-size:12px;background:var(--blue-bg);color:var(--blue);}
.chip .x{font-weight:700;opacity:.7;} .chip .x:hover{opacity:1;}
.chip.gray{background:var(--gray-bg);color:var(--t2);}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.filters{display:flex;gap:6px;flex-wrap:wrap;}
.filters .f{padding:3px 10px;border-radius:11px;font-size:11px;background:var(--gray-bg);color:var(--t2);}
.filters .f.on{background:var(--blue);color:#fff;}

.preset-row{display:flex;align-items:center;gap:8px;background:var(--canvas);border-radius:6px;height:32px;padding:0 12px;font-size:13px;margin-bottom:8px;}
.preset-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mockchip{display:inline-flex;align-items:center;padding:4px 9px;border-radius:11px;font-size:11.5px;background:var(--card);border:1px solid var(--line);color:var(--t2);margin:0 6px 6px 0;}
.mockchip.sel{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.field label{font-size:12px;color:var(--t2);}
.field .hint{font-size:11px;color:var(--t3);}

.lv-row{display:flex;align-items:center;gap:10px;background:var(--canvas);border-radius:6px;height:40px;padding:0 12px;margin-bottom:8px;}
.lv-badge{width:28px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;background:var(--blue);}
.lv-row .nm{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lv-row .lat{font-size:11px;color:var(--t2);}
.iconbtn{color:var(--t2);font-size:12px;padding:0 3px;} .iconbtn:hover{color:var(--blue);}

.guard-row{display:flex;align-items:center;gap:12px;padding:12px 0;}
.guard-row + .guard-row{border-top:1px solid var(--line);}
.guard-row .txt{flex:1;}
.guard-row .lb{font-size:13px;margin-bottom:2px;}
.guard-row .ds{font-size:11px;color:var(--t2);line-height:1.6;}
.callout{border-left:3px solid var(--blue);background:var(--canvas);border-radius:0 6px 6px 0;padding:12px 16px;font-size:12px;line-height:1.8;}
.callout.warn{border-left-color:var(--amber);background:var(--amber-bg);}

.rep h4{font-size:13px;font-weight:600;margin:12px 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.rep h4:first-child{margin-top:0;}
.rep h4 .g{font-size:11px;padding:1px 7px;border-radius:10px;font-weight:600;}
.rep h4 .bv{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--t3);font-weight:400;}
.g.z{background:var(--green-bg);color:var(--green-tx);} .g.k{background:var(--blue-bg);color:var(--blue);} .g.n{background:var(--gray-bg);color:var(--t2);}
.rep .reason{font-size:12.5px;color:var(--t2);margin-bottom:4px;}
.rep ul{list-style:none;margin:0 0 6px;}
.rep li{font-size:11.5px;color:var(--t3);line-height:1.7;}
.rep li.q{color:var(--t2);}
.rep li.st{color:var(--green-tx);font-weight:600;}
.rep li.st.no{color:var(--t2);font-weight:400;}

#toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;font-size:13px;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99;max-width:80vw;}
#toast.show{opacity:.92;transform:translateX(-50%) translateY(0);}

#login{position:fixed;inset:0;background:rgba(17,17,17,.45);display:none;align-items:center;justify-content:center;z-index:80;}
#login.show{display:flex;}
#login .box{background:var(--card);border-radius:12px;padding:24px;width:320px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;}
#login img{width:220px;height:220px;object-fit:contain;background:var(--gray-bg);border-radius:8px;}
#login .hint{font-size:12px;color:var(--t2);line-height:1.7;}


/* ===== 深色：跟随系统自动切换 ===== */
@media (prefers-color-scheme: dark){
  :root{
    --canvas:#131417; --card:#1b1d22; --line:#2b2e36; --sidebar:#171920;
    --blue:#5c9bff; --green:#4cc16d; --amber:#f5c451; --red:#f27b72;
    --t1:#e9ebef; --t2:#a0a6b0; --t3:#6f7681;
    --green-bg:rgba(76,193,109,.16); --green-tx:#6fd68f;
    --blue-bg:rgba(92,155,255,.16);
    --amber-bg:rgba(245,196,81,.14); --amber-tx:#f0c765;
    --red-bg:rgba(242,123,114,.16); --red-tx:#f2a29a;
    --gray-bg:#23262d;
  }
  .toggle{background:#3a3e47;}
  .toggle::after{box-shadow:0 1px 2px rgba(0,0,0,.5);}
  .pill:hover{background:rgba(92,155,255,.12);}
  .logline.open .raw{color:#8b929c;}
  .logbox::-webkit-scrollbar-thumb{background:#3a3e47;}
  #toast{background:#e9ebef;color:#131417;}
  .btn.ghost{border-color:#3a3e47;}
  .btn.primary:hover{background:#4a8bef;}
  .btn.danger:hover{background:#e06a61;}
}

@media (max-width:900px){
  .grid2,.form-grid{grid-template-columns:1fr;}
  .sidebar{width:100%;position:static;flex-direction:row;flex-wrap:wrap;}
  .sidebar .pill{width:auto;}
  .side-spacer,.mode-card{display:none;}
  .main{flex-direction:column;}
  .row-flex > .card{min-width:100%;}
}

/* ===== 手机档（≤600px）：只影响手机/极窄窗口，电脑上的样子一个像素不变 =====
   用户反馈（2026-10-31）：手机浏览器里打开显得字小、顶栏挤。
   原因：整页按电脑标准排（正文 14px、搜索框固定 260px），手机屏根本装不下顶栏。
   做法：字号加大一档、顶栏允许折行（搜索框独占一行）、卡片和导航加高好点按。 */
@media (max-width:600px){
  body{font-size:15.5px;}
  .window{padding:10px;gap:10px;}
  .topbar{height:auto;min-height:48px;flex-wrap:wrap;padding:8px 12px;row-gap:6px;}
  .brand{font-size:15px;}
  .search{margin-left:0;order:3;width:100%;}
  .spill{margin-left:auto;font-size:12.5px;}
  .banner{font-size:13px;}
  .card{padding:14px;border-radius:10px;}
  .sidebar{gap:6px;}
  .pill{height:40px;font-size:14px;border-radius:20px;}
  .btn{min-height:38px;}
  #login img{width:180px;height:180px;}
  /* 这两处页面里有内联 font-size:13px，手机上统一放大 */
  textarea{font-size:15px !important;}
  input,select{font-size:15px !important;}
  /* 设置行手机上改上下排：左边说明不再和控件挤在一行（看不全的主因） */
  .guard-row{flex-wrap:wrap;}
  .guard-row .txt{flex:1 1 100%;}
  .guard-row .selectbox,.guard-row .stepper,.guard-row .inputbox{width:100%;}
  .guard-row .inputbox{width:100% !important;}
  .selpop{max-width:90vw;}
  .lb{font-size:14.5px;}
  .ds{font-size:13px;}
}
</style>
</head>
<body>
<div class="window">
  <header class="topbar">
    <div class="brand"><span class="dot"></span>刷B站观测台</div>
    <div class="search"><input id="q" placeholder="搜索日志…" autocomplete="off"></div>
    <span class="spill" id="spill"><span class="sd"></span><span id="spill-t">连接中…</span></span>
  </header>

  <div id="banner-slot"></div>

  <div class="main">
    <aside class="sidebar" id="side">
      <button class="pill active" data-page="overview">总览</button>
      <button class="pill" data-page="models">模型与密钥</button>
      <button class="pill" data-page="logs">专业日志</button>
      <button class="pill" data-page="persona">人设</button>
      <button class="pill" data-page="chain">降级链</button>
      <button class="pill" data-page="safety">安全防护</button>
      <button class="pill" data-page="publish">发布</button>
      <button class="pill" data-page="settings">设置</button>
      <div class="side-spacer"></div>
      <div class="mode-card">
        <b>当前控制：网页</b>
        <button class="link" id="to-dsh">DSH 里也有同一份 →</button>
      </div>
    </aside>

    <div class="content">
      <section class="page active" id="page-overview"></section>
      <section class="page" id="page-models"></section>
      <section class="page" id="page-logs"></section>
      <section class="page" id="page-persona"></section>
      <section class="page" id="page-chain"></section>
      <section class="page" id="page-safety"></section>
      <section class="page" id="page-publish"></section>
      <section class="page" id="page-settings"></section>
    </div>
  </div>
</div>

<div id="login"><div class="box">
  <b style="font-size:14px">扫码登录 B站</b>
  <img id="qr" alt="二维码" src="">
  <div class="hint" id="login-hint">正在生成二维码…</div>
  <button class="btn ghost sm" id="login-close">关闭</button>
</div></div>
<div id="toast"></div>

<script>
(function () {
  'use strict';
  var API = '/api/bili-console';
  var S = { state: null, me: null, report: null, rawlog: [], page: 'overview', logLv: 'ALL', q: '' };
  var drafting = {};      // 正在输入的草稿，避免 3 秒轮询把它冲掉
  var loginTimer = null;

  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function get(p) { return fetch(API + p, { credentials: 'same-origin' }).then(function (r) { return r.json(); }); }
  function post(p, body) {
    return fetch(API + p, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {})
    }).then(function (r) { return r.json(); });
  }
  function save(key, val, label) {
    var b = {}; b[key] = val;
    return post('/settings', b).then(function (r) {
      toast(r && r.ok ? ((label || key) + ' 已保存') : ('保存失败：' + ((r && r.error) || '')));
      return refresh();
    }).catch(function (e) { toast('保存失败：' + e.message); });
  }

  function st() { return S.state || {}; }
  function cfg() { return st().settings || {}; }
  function q() { return st().quota || {}; }
  function lg() { return st().login || {}; }
  function running() { return !!(st().run && st().run.running); }
  function stopReq() { return !!(st().run && st().run.stopRequested); }
  var NOISE = /已就绪并挂载|使用系统 Python|已挂载（网页控制台在线）|^手动轮次|^定时轮次|^设置页手动轮次|\{"ran":/;

  function renderTop() {
    var sp = $('#spill'), t = $('#spill-t');
    sp.className = 'spill';
    if (running()) { sp.classList.add('run'); t.textContent = (st().run.label || '运行中') + (stopReq() ? ' · 收尾中' : ''); }

  function renderMarkdown(md) {
    var out = [], blocks = String(md || '').split(/\n(?=###\s)/).filter(function (x) { return x.trim(); });
    blocks.forEach(function (blk) {
      var lines = blk.split('\n'), head = lines.shift() || '';
      var m = head.match(/^###\s+(BV\S+)\s*·\s*(.+)$/) || head.match(/^###\s+(.*)$/);
      var bv = m ? m[1] : '', grade = (m && m[2]) ? m[2] : '';
      var gcls = /值得看/.test(grade) ? 'z' : (/可以看/.test(grade) ? 'k' : 'n');
      out.push('<h4><span class="bv">' + esc(bv) + '</span><span class="g ' + gcls + '">' + esc(grade) + '</span></h4>');
      var lis = [];
      lines.forEach(function (ln) {
        var s = ln.trim();
        if (!s) return;
        if (/^-\s*状态[:：]/.test(s)) { lis.push('<li class="st' + (/未发布|试跑|中断/.test(s) ? ' no' : '') + '">' + esc(s.replace(/^-\s*/, '')) + '</li>'); return; }
        if (/^-\s*拟评论/.test(s)) { lis.push('<li class="q">' + esc(s.replace(/^-\s*/, '')) + '</li>'); return; }
        if (/^-\s/.test(s)) { lis.push('<li>' + esc(s.replace(/^-\s*/, '')) + '</li>'); return; }
        out.push('<div class="reason">' + esc(s) + '</div>');
      });
      if (lis.length) out.push('<ul>' + lis.join('') + '</ul>');
    });
    return out.join('');
  }

    var sbtn = ev.target.closest('[data-selbtn]');
    if (sbtn) {
      var sbox = sbtn.closest('[data-selbox]');
      var spop = sbox ? sbox.querySelector('[data-selpop]') : null;
      var show = !!(spop && spop.style.display !== 'block');
      document.querySelectorAll('[data-selpop]').forEach(function (x) { x.style.display = 'none' });
      if (spop && show) spop.style.display = 'block';
      return;
    }
    var sopt = ev.target.closest('[data-selopt]');
    if (sopt) {
      var sb = sopt.closest('[data-selbox]');
      if (sb) {
        var hid = sb.querySelector('[data-sel]');
        if (hid) { hid.value = sopt.getAttribute('data-v'); hid.dispatchEvent(new Event('change', { bubbles: true })) }
        var lbl = sb.querySelector('[data-seltxt]');
        if (lbl) lbl.textContent = sopt.textContent;
        sb.querySelectorAll('[data-selopt]').forEach(function (x) { x.classList.remove('on') });
        sopt.classList.add('on');
        var pp = sb.querySelector('[data-selpop]');
        if (pp) pp.style.display = 'none';
      }
      return;
    }
    if (!ev.target.closest('[data-selbox]')) {
      document.querySelectorAll('[data-selpop]').forEach(function (x) { x.style.display = 'none' });
    }
    var pill = ev.target.closest('.pill');
    if (pill && pill.dataset.page && !ev.target.closest('[data-act]')) return goto(pill.dataset.page);
    var t = ev.target.closest('[data-act]');
    if (!t) return;
    var act = t.dataset.act, c = cfg();

    if (act === 'go') return goto(t.dataset.page);
    if (act === 'raw') return t.classList.toggle('open');

    if (act === 'set') {
      var key = t.dataset.key, val = t.dataset.val === '1';
      if (key === 'contextMode') return save('contextMode', val ? 'thread' : 'isolated', '上下文设置');
      return save(key, val);
    }
    if (act === 'step') {
      var k2 = t.dataset.key, d = Number(t.dataset.d) || 0;
      return save(k2, Math.max(0, Number(c[k2] || 0) + d));
    }
    if (act === 'lv') { S.logLv = t.dataset.lv; return paint(); }
    if (act === 'setdm') return save('dmMode', t.dataset.v, '私信投递');
    if (act === 'savevision') {
      var cur = cfg().visionModel || {};
      var url = String(drafting.vUrl != null ? drafting.vUrl : (cur.apiUrl || '')).trim();
      var model = String(drafting.vModel != null ? drafting.vModel : (cur.modelName || '')).trim();
      var kv = String(drafting.vKey != null ? drafting.vKey : '').trim();
      if (!url || !model) return toast('API 地址和模型名都要填');
      return post('/settings', { visionModel: { apiUrl: url, modelName: model, apiKey: kv || cur.apiKey || '' } })
        .then(function (r) { toast(r.ok ? '识图模型已保存' : '保存失败'); drafting.vUrl = drafting.vModel = drafting.vKey = null; refresh(); });
    }

    if (act === 'dry') return post('/run/now', { force: true, dryRun: true })
      .then(function (r) { toast(r.message || '已开始试跑'); setTimeout(refresh, 800); })
      .catch(function (e) { toast('失败：' + e.message); });
    if (act === 'run') {
      if (c.autoComment && !confirm('自动评论开着，这一轮会真的在你号上发评论。确定？')) return;
      return post('/run/now', { force: true })
        .then(function (r) { toast(r.message || '已开始'); setTimeout(refresh, 800); })
        .catch(function (e) { toast('失败：' + e.message); });
    }
    if (act === 'stop') return post('/run/stop', {}).then(function (r) { toast(r.message || '已请求停止'); setTimeout(refresh, 600); });

    // ============ 发布：动态（你自己写，点发布才发） ============
    if (act === 'pub-gen') {
      var topicEl = $('#gen-topic');
      var topic = topicEl ? String(topicEl.value || '').trim() : '';
      var gs = $('#gen-status');
      if (gs) gs.textContent = '启动中…';
      return post('/publish/genvideo', { topic: topic }).then(function (r) {
        if (!r || !r.ok) { if (gs) gs.textContent = '失败：' + ((r && r.error) || '未知'); return toast('启动失败') }
        if (gs) gs.textContent = '生成中…';
        var timer = setInterval(function () {
          get('/publish/genvideo/status').then(function (s) {
            if (gs) gs.textContent = s.error ? ('失败：' + s.error) : (s.done ? '完成' : ((s.phase || '') + ' ' + (s.pct || 0) + '%'));
            if (s.done && s.outPath) {
              clearInterval(timer);
              var vp = $('#vid-path'); if (vp) vp.value = s.outPath;
              toast('生成好了，路径已填进投稿表单');
            } else if (s.error) { clearInterval(timer); toast('生成失败：' + s.error) }
          }).catch(function () { /* 下一轮再试 */ });
        }, 1500);
      }).catch(function (e) { if (gs) gs.textContent = '失败：' + e.message; toast('启动失败：' + e.message) });
    }
    if (act === 'pub-dynamic') {
      var txt = ($('#dyn-input') || {}).value || '';
      txt = txt.trim();
      if (!txt) return toast('动态内容不能为空（你自己写，AI 不代写）');
      if (!confirm('确定发这条动态？\n\n' + txt.slice(0, 120) + (txt.length > 120 ? '...' : ''))) return;
      var resEl = $('#dyn-result');
      if (resEl) resEl.textContent = '发布中...';
      return post('/publish/dynamic', { text: txt })
        .then(function (r) {
          if (resEl) resEl.textContent = r.ok ? '✓ 已发布' : ('失败：' + (r.error || '未知'));
          toast(r.ok ? '动态已发布' : ('发布失败：' + (r.error || '')));
          if (r.ok) { var di = $('#dyn-input'); if (di) di.value = ''; }
        })
        .catch(function (e) { if (resEl) resEl.textContent = '失败：' + e.message; toast('发布失败：' + e.message); });
    }

    // ============ 发布：视频（点启动才投稿） ============
    if (act === 'pub-video') {
      var vp = ($('#vid-path') || {}).value || '';
      var vt = ($('#vid-title') || {}).value || '';
      if (!vp.trim()) return toast('缺视频文件路径');
      if (!vt.trim()) return toast('缺视频标题');
      if (!confirm('确定投稿这个视频？\n\n标题：' + vt.slice(0, 80) + '\n路径：' + vp.slice(0, 80) + '\n\n上传后 B 站自己审核，不可撤回。')) return;
      var vresEl = $('#vid-result');
      if (vresEl) vresEl.textContent = '上传中（大文件可能要几分钟）...';
      return post('/publish/video', {
        videoPath: vp.trim(),
        title: vt.trim(),
        desc: (($('#vid-desc') || {}).value || '').trim(),
        tid: Number(($('#vid-tid') || {}).value || '124'),
        tags: (($('#vid-tags') || {}).value || 'AI,测评').trim(),
        coverPath: (($('#vid-cover') || {}).value || '').trim()
      })
        .then(function (r) {
          if (vresEl) vresEl.textContent = r.ok ? '✓ 已投稿' : ('失败：' + (r.error || '未知'));
          toast(r.ok ? '视频已投稿' : ('投稿失败：' + (r.error || '')));
        })
        .catch(function (e) { if (vresEl) vresEl.textContent = '失败：' + e.message; toast('投稿失败：' + e.message); });
    }
    if (act === 'retract') {
      var cnt = ((st().posted || {}).count) || 0;
      if (!cnt) return toast('账本是空的：没有可撤回的内容');
      var last = ((st().posted || {}).last) || {};
      if (!confirm('撤回最近 1 条？\n\n' + (last.at || '') + ' · ' + (last.bvid || '') + '\n' + (last.text || '') + '\n\n会在 B站 上把它删掉，不可恢复。')) return;
      return post('/retract', { count: 1 }).then(function (r) {
        toast(r.message || '已开始撤回');
        setTimeout(refresh, 1500);
      });
    }
    if (act === 'dm') return post('/dm/check', {}).then(function (r) { toast(r.message || '已发起私信检查'); });
    if (act === 'clearmem') {
      if (!confirm('清空所有视频的对话上下文？不可恢复。')) return;
      return post('/memory/clear', {}).then(function (r) { toast(r.ok ? '已清空' : '清空失败'); refresh(); });
    }
    if (act === 'pause') {
      if (!confirm('一键暂停：关掉自动评论和私信投递？')) return;
      return post('/settings', { autoComment: false, dmMode: 'off' }).then(function () { toast('已暂停对外动作'); refresh(); });
    }
    if (act === 'saveorder') {
      var ids = ((st().chain && st().chain.endpoints) || []).map(function (e) { return e.id; });
      return post('/settings', { chainOrder: ids }).then(function (r) { toast(r.ok ? '顺序已保存' : '保存失败'); refresh(); });
    }
    if (act === 'mv') {
      var arr = ((st().chain && st().chain.endpoints) || []).map(function (e) { return e.id; });
      var i = Number(t.dataset.i), j = i + Number(t.dataset.d);
      if (j < 0 || j >= arr.length) return;
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      return post('/settings', { chainOrder: arr }).then(function () { toast('已调序'); refresh(); });
    }
    if (act === 'rm') {
      var cur2 = ((st().chain && st().chain.endpoints) || []).map(function (e) { return e.id; })
        .filter(function (x) { return x !== t.dataset.id; });
      return post('/settings', { chainOrder: cur2 }).then(function () { toast('已移出链'); refresh(); });
    }
    if (act === 'chip') {
      var id = 'preset:' + t.dataset.prov + ':' + t.dataset.model;
      var cur3 = ((st().chain && st().chain.endpoints) || []).map(function (e) { return e.id; });
      var at = cur3.indexOf(id);
      if (at >= 0) cur3.splice(at, 1); else cur3.push(id);
      return post('/settings', { chainOrder: cur3 }).then(function () { toast(at >= 0 ? '已移出链' : '已加入链'); refresh(); });
    }
    if (act === 'prov') {
      var g = (st().chain.presets || []).filter(function (x) { return x.provider === t.dataset.prov; })[0];
      if (!g) return;
      var ids2 = g.models.map(function (m) { return 'preset:' + g.provider + ':' + m.id; });
      if (t.dataset.add === '1' && ids2.length > 50) return toast('这个 key 下有 ' + ids2.length + ' 个模型，整组加太多，挑几个吧');
      var cur4 = ((st().chain && st().chain.endpoints) || []).map(function (e) { return e.id; });
      if (t.dataset.add === '1') { ids2.forEach(function (x) { if (cur4.indexOf(x) < 0) cur4.push(x); }); }
      else { cur4 = cur4.filter(function (x) { return ids2.indexOf(x) < 0; }); }
      return post('/settings', { chainOrder: cur4 }).then(function () { toast('已更新该 key 的链'); refresh(); });
    }
    if (act === 'provmore') { S['prov_' + t.dataset.prov] = !S['prov_' + t.dataset.prov]; return paint(); }
    if (act === 'addmodel') {
      var url = String(drafting.mUrl || '').trim().replace(/\/+$/, '');
      var names = String(drafting.mModel || '').split(/[,，\n、]+/).map(function (s) { return s.trim(); }).filter(Boolean);
      if (!url || !names.length) return toast('API 地址和模型名都要填');
      if ((drafting.mKeySrc || 'custom') === 'custom' && !drafting.mKey) return toast('选了「自己填 key」就得填 key');
      var models = (cfg().models || []).slice();
      names.forEach(function (n, idx) {
        models.push({
          id: 'm' + Date.now() + '_' + idx, provider: drafting.prov || 'deepseek',
          displayName: names.length > 1 ? ((drafting.mName || drafting.prov || 'model') + ' · ' + n) : (drafting.mName || n),
          apiUrl: url, modelName: n, apiKeySource: drafting.mKeySrc || 'custom',
          customKey: (drafting.mKeySrc || 'custom') === 'custom' ? drafting.mKey : '',
          addToChain: $('#mChain') ? $('#mChain').checked : true
        });
      });
      return post('/settings', { models: models }).then(function (r) {
        toast(r.ok ? ('已加入 ' + names.length + ' 个模型') : '保存失败');
        drafting.mModel = ''; drafting.mKey = ''; drafting.mName = '';
        refresh();
      });
    }
    if (act === 'savepersona') {
      return save('personaPrompt', drafting.personaPrompt != null ? drafting.personaPrompt : (c.personaPrompt || ''), '人设');
    }
    if (act === 'resetpersona') { drafting.personaPrompt = null; return paint(); }
    if (act === 'delkw') {
      var list = (Array.isArray(c.keywords) ? c.keywords.slice() : String(c.keywords || '').split('\n').filter(Boolean));
      list.splice(Number(t.dataset.i), 1);
      return save('keywords', list.join('\n'), '关键词');
    }
    if (act === 'saveall') {
      var patch = {};
      if (drafting.keywords != null) patch.keywords = drafting.keywords;
      if (drafting.personaPrompt != null) patch.personaPrompt = drafting.personaPrompt;
      ['mentionName', 'dmUid', 'favFolderId'].forEach(function (k) { if (drafting[k] != null) patch[k] = drafting[k]; });
      if (!Object.keys(patch).length) return toast('没有要保存的改动');
      return post('/settings', patch).then(function (r) { toast(r.ok ? '已保存' : '保存失败'); drafting = {}; refresh(); });
    }
    if (act === 'reload') { drafting = {}; return refresh().then(function () { toast('已重新载入'); }); }
    if (act === 'rep') {
      var body = $('#rep-body'); if (!body) return;
      var open = body.style.maxHeight === 'none';
      body.style.maxHeight = open ? '170px' : 'none';
      t.textContent = open ? ('展开全部 ' + ((S.report && S.report.picked) || 0) + ' 条') : '收起';
      return;
    }
    if (act === 'login') return startLogin();
    if (act === 'logout') {
      if (!confirm('退出当前 B站 账号？退出后想再刷就要重新扫码（正好可以换别的号扫）。')) return;
      post('/logout', {}).then(function (r) { toast(r.ok ? '已退出登录，现在可以扫码换账号了' : ('退出失败：' + (r.error || ''))); paint(); });
      return;
    }
  });

  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.dataset && el.dataset.draft) {
      drafting[el.dataset.draft] = el.value;
      if (el.dataset.draft === 'personaPrompt') {
        var cnt = $('#pcount'); if (cnt) { var pm = Math.max(500, Math.min(200000, Number(cfg().personaMaxLen) || 8000)); cnt.textContent = el.value.length + ' / ' + pm + ' 字' }
      }
    }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.target.id === 'newkw' && ev.key === 'Enter') {
      var v = ev.target.value.trim(); if (!v) return;
      var list = (Array.isArray(cfg().keywords) ? cfg().keywords.slice() : String(cfg().keywords || '').split('\n').filter(Boolean));
      list.push(v);
      save('keywords', list.join('\n'), '关键词');
      ev.target.value = '';
    }
    if (ev.target.id === 'q' && ev.key === 'Enter') { S.q = ev.target.value.trim(); goto('logs'); }
  });

  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.dataset && el.dataset.sel) {
      var k = el.dataset.sel;
      if (k === 'prov') { drafting.prov = el.value; drafting.mUrl = null; return paint(); }
      if (k === 'mKeySrc') { drafting.mKeySrc = el.value; return; }
      return save(k, el.value);
    }
  });

  $('#q').addEventListener('input', function (e) { S.q = e.target.value.trim(); if (S.page === 'logs') paint(); });
  $('#to-dsh').addEventListener('click', function () { toast('在 DSH 的「设置 → 刷视频」里也是这一份，功能一样'); });

  function startLogin() {
    $('#login').classList.add('show');
    $('#qr').src = '';
    $('#login-hint').textContent = '正在准备二维码…首次使用会自动搭环境 + 下载依赖（约 2-5 分钟，属正常现象，可看下方日志的实时进度），之后每次都是秒开。';
    post('/login/start', {}).then(function (r) {
      if (!r.ok) { $('#login-hint').textContent = '生成失败：' + (r.error || ''); return; }
      var img = r.qr || '';
      if (img && img.indexOf('data:') !== 0 && img.indexOf('http') !== 0) img = 'data:image/png;base64,' + img;
      $('#qr').src = img;
      $('#login-hint').textContent = '二维码已生成，用 B站 App 扫码，180 秒内有效';
      clearInterval(loginTimer);
      loginTimer = setInterval(function () {
        post('/login/check', {}).then(function (c) {
          if (!c.ok) { $('#login-hint').textContent = c.error || '检查失败'; }
          else if (c.status === 'done') {
            clearInterval(loginTimer);
            $('#login-hint').textContent = '登录成功';
            toast('登录成功');
            setTimeout(function () { $('#login').classList.remove('show'); refresh(); }, 800);
          } else if (c.status === 'scanned') $('#login-hint').textContent = '已扫码，请在手机上确认';
          else if (c.status === 'timeout') { clearInterval(loginTimer); $('#login-hint').textContent = '二维码过期，重新打开登录'; }
          else $('#login-hint').textContent = '等待扫码…';
        });
      }, 2000);
    });
  }
  $('#login-close').addEventListener('click', function () { clearInterval(loginTimer); $('#login').classList.remove('show'); });

  function refresh() {
    return get('/state').then(function (s) {
      S.state = s;
      paint();
      if (s && s.login && s.login.loggedIn && !S.me) {
        get('/me').then(function (r) { if (r && r.ok && r.me) { S.me = r.me; paint(); } }).catch(function () {});
      }
      return Promise.all([
        get('/report').then(function (r) { S.report = r; }).catch(function () {}),
        (S.page === 'logs' || S.page === 'overview')
          ? get('/rawlog').then(function (r) { S.rawlog = (r && r.lines) || []; }).catch(function () {})
          : Promise.resolve()
      ]).then(function () { paint(); });
    }).catch(function (e) {
      $('#spill').className = 'spill err';
      $('#spill-t').textContent = '连不上插件服务';
      console.error(e);
    });
  }

  // 支持 ?p=models 这样直达某页（无头截图也靠它；#hash 在无头模式下会被忽略）
  var qs0 = new URLSearchParams(location.search);
  var wantPage = qs0.get('p') || (location.hash || '').replace('#', '');
  goto(RENDER[wantPage] ? wantPage : 'overview');
  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
